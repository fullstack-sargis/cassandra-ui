services:
  cassandra:
    image: cassandra:5.0
    container_name: cassandra-ui-cassandra
    environment:
      CASSANDRA_CLUSTER_NAME: cassandra-ui
      CASSANDRA_DC: dc1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
    ports:
      - "9042:9042"
    volumes:
      - cassandra-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES' localhost 9042"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s

  backend:
    build:
      context: ./backend
    container_name: cassandra-ui-backend
    environment:
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      cassandra:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: cassandra-ui-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  cassandra-data:
